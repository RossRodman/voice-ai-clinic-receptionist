repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^(server|client)/tsconfig.*\.json$
      - id: check-added-large-files
      - id: detect-private-key

  # Server (uses the project's own Prettier/oxlint from server/node_modules)
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: server/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^server/
        exclude: ^server/package-lock\.json$
      - id: oxlint
        name: oxlint
        entry: server/node_modules/.bin/oxlint -c server/.oxlintrc.json --deny-warnings
        language: system
        files: ^server/src/.*\.ts$

  # Client
  - repo: local
    hooks:
      - id: prettier-client
        name: prettier (client)
        entry: client/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^client/
        exclude: ^client/package-lock\.json$
      - id: oxlint-client
        name: oxlint (client)
        entry: client/node_modules/.bin/oxlint -c client/.oxlintrc.json --deny-warnings
        language: system
        files: ^client/src/.*\.(ts|tsx)$
