# The web UI on http://localhost:8080, the webhook server on http://localhost:3000
#
#   cp .env.example .env    # set VAPI_SERVER_SECRET
#   docker compose up -d --build

services:
  server:
    build: ./server
    ports:
      - "${SERVER_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      SERVER_UPSTREAM: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
