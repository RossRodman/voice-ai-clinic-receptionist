# Rendered by the nginx image at startup: ${SERVER_UPSTREAM} comes from the env.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The dashboard API on the webhook server.
    location /api/ {
        proxy_pass ${SERVER_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server liveness, for the status pill.
    location = /health {
        proxy_pass ${SERVER_UPSTREAM}/health;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html, and the router takes over.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
